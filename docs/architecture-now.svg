<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" width="1280" height="710" role="img" aria-labelledby="now-title now-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="now-title">Now: every step runs on your Mac</title>
  <desc id="now-desc">The demo as built. One command, uv run le-chonk demo, runs on your Mac: a Slack bot over Socket Mode, the triage agent's tools, the Workflows worker with the watcher, judge, merge and release steps, a GitHub client that uses your token, and Vibe 2.0 in a Docker container. Mistral's cloud holds the le-chonk-triage Studio agent, whose function calls come back to the Mac; Mistral Workflows, which keeps the executions and hands their steps to the worker on the Mac; and the Mistral API.</desc>
  <defs>
    <marker id="now-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1280" height="710" fill="#ffffff"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#111827">
    <text x="24" y="38" font-size="18" font-weight="700">Now: every step runs on your Mac</text>

    <!-- Lanes -->
    <rect x="12" y="60" width="1256" height="140" rx="10" fill="#f5f6f8" stroke="#dde1e6"/>
    <rect x="12" y="215" width="1256" height="225" rx="10" fill="#eef3ff" stroke="#d3def7"/>
    <rect x="12" y="455" width="1256" height="200" rx="10" fill="#f1f7ee" stroke="#d6e8cd"/>
    <g font-size="11" font-weight="700" fill="#4b5563" letter-spacing="0.8">
      <text x="24" y="80">YOUR ACCOUNTS</text>
      <text x="24" y="235">MISTRAL CLOUD</text>
      <text x="24" y="475">YOUR MAC</text>
    </g>

    <!-- Your accounts: Slack and GitHub -->
    <g fill="#ffffff" stroke="#9aa3af">
      <rect x="60" y="96" width="160" height="80" rx="8"/>
      <rect x="310" y="96" width="780" height="80" rx="8"/>
      <rect x="1110" y="96" width="140" height="80" rx="8"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="75" y="122">Slack</text>
      <text x="325" y="122">GitHub</text>
      <text x="1125" y="122">Slack</text>
    </g>
    <g font-size="12" fill="#4b5563">
      <text x="75" y="142">you write a task</text>
      <text x="75" y="158">in a thread</text>
      <text x="325" y="142">your repo: issues · branches · PRs · releases with the APK</text>
      <text x="1125" y="142">the result,</text>
      <text x="1125" y="158">in the thread</text>
    </g>

    <!-- Mistral cloud: Studio services only -->
    <g fill="#efe6ff" stroke="#7c5cc9">
      <rect x="310" y="262" width="180" height="96" rx="8"/>
      <rect x="510" y="262" width="180" height="96" rx="8"/>
      <rect x="710" y="262" width="160" height="96" rx="8"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="325" y="288">le-chonk-triage</text>
      <text x="525" y="288">Mistral Workflows</text>
      <text x="725" y="288">Mistral API</text>
    </g>
    <g font-size="12" fill="#4b5563">
      <text x="325" y="308">Studio agent</text>
      <text x="325" y="324">function tools</text>
      <text x="525" y="308">keeps the executions,</text>
      <text x="525" y="324">hands out the steps</text>
      <text x="725" y="308">Large 4</text>
      <text x="725" y="324">every model call</text>
    </g>

    <!-- Your Mac: one command -->
    <rect x="40" y="486" width="1060" height="156" rx="8" fill="#e3f1dc" stroke="#4f9a3a"/>
    <g fill="#ffffff" stroke="#4f9a3a">
      <rect x="60" y="500" width="160" height="96" rx="6"/>
      <rect x="310" y="500" width="180" height="96" rx="6"/>
      <rect x="510" y="500" width="180" height="96" rx="6"/>
      <rect x="710" y="500" width="160" height="96" rx="6" stroke-dasharray="5 4"/>
      <rect x="910" y="500" width="180" height="96" rx="6"/>
    </g>
    <g font-size="14" font-weight="700">
      <text x="75" y="524">Slack bot</text>
      <text x="325" y="524">triage tools</text>
      <text x="525" y="524">Workflows worker</text>
      <text x="725" y="524">Docker container</text>
      <text x="925" y="524">GitHub client</text>
    </g>
    <g font-size="12" fill="#4b5563">
      <text x="75" y="544">Socket Mode</text>
      <text x="75" y="560">bot and app tokens</text>
      <text x="325" y="544">find, file and label</text>
      <text x="325" y="560">issues</text>
      <text x="525" y="544">watcher · judge</text>
      <text x="525" y="560">PR · merge · release</text>
      <text x="925" y="544">REST and git</text>
      <text x="925" y="560">your token</text>
    </g>
    <g font-size="11" fill="#4b5563">
      <text x="725" y="544">Vibe 2.0, Kotlin</text>
      <text x="725" y="559">Toolchain, Android SDK</text>
      <text x="725" y="576">Harbor starts it</text>
    </g>
    <text x="60" y="626" font-size="13" font-weight="700">uv run le-chonk demo</text>
    <text x="215" y="626" font-size="12" fill="#4b5563">one command runs everything that touches Slack, GitHub or Docker</text>

    <!-- Arrows -->
    <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#now-arrow)">
      <line x1="140" y1="178" x2="140" y2="498" marker-start="url(#now-arrow)"/>
      <polyline points="220,548 265,548 265,310 308,310"/>
      <line x1="400" y1="360" x2="400" y2="498" marker-start="url(#now-arrow)"/>
      <line x1="600" y1="360" x2="600" y2="498" marker-start="url(#now-arrow)"/>
      <line x1="790" y1="500" x2="790" y2="360"/>
      <line x1="1000" y1="500" x2="1000" y2="178"/>
      <polyline points="1100,626 1180,626 1180,178"/>
    </g>

    <!-- Arrow labels -->
    <g font-size="11" fill="#374151">
      <text x="152" y="252">messages and replies</text>
      <text x="275" y="405">conversation</text>
      <text x="412" y="409">function calls</text>
      <text x="412" y="423">come back here</text>
      <text x="612" y="409">steps and</text>
      <text x="612" y="423">their results</text>
      <text x="802" y="416">model calls</text>
      <text x="1012" y="290">issues, PRs, push,</text>
      <text x="1012" y="304">releases,</text>
      <text x="1012" y="318">with your token</text>
      <text x="1192" y="380">results in</text>
      <text x="1192" y="394">the thread</text>
    </g>

    <!-- Legend -->
    <g font-size="11" fill="#374151">
      <rect x="60" y="674" width="14" height="14" rx="3" fill="#efe6ff" stroke="#7c5cc9"/>
      <text x="82" y="685">Studio services</text>
      <rect x="200" y="674" width="14" height="14" rx="3" fill="#e3f1dc" stroke="#4f9a3a"/>
      <text x="222" y="685">your Mac</text>
      <rect x="310" y="674" width="14" height="14" rx="3" fill="#ffffff" stroke="#4f9a3a" stroke-dasharray="3 2"/>
      <text x="332" y="685">a container</text>
    </g>
  </g>
</svg>
