      <text x="170" y="218">reads every minute</text>
      <text x="265" y="322" text-anchor="middle">conversation</text>
      <text x="430" y="211">checks for duplicates,</text>
      <text x="430" y="225">files the issue</text>
      <text x="630" y="211">polls every minute</text>
      <text x="630" y="225">for vibe:ready</text>
      <text x="630" y="409">starts the run</text>
      <text x="630" y="423">via the Workflows API</text>
      <text x="800" y="416">model calls</text>
      <text x="920" y="475">pushes the branch</text>
      <text x="920" y="489">and the APK release,</text>
