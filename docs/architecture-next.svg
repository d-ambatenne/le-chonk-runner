<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 710" width="1280" height="710" role="img" aria-labelledby="next-title next-desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="next-title">Next: Studio in Mistral's cloud, Vibe on your Mac</title>
  <desc id="next-desc">The next phase. The le-chonk-slack workflow on the managed deployment le-chonk-control reads your Slack channel every minute through the Slack connector, and passes each new message to the le-chonk-triage Studio agent. The agent checks for duplicates and files the GitHub issue through the GitHub connector. The le-chonk-tasks workflow, also on le-chonk-control, polls the issues through the connector and starts a run on the le-chonk-vibe worker on your Mac through the Workflows API. There, Vibe 2.0 runs in a Docker container and calls the Mistral API, and the worker pushes the branch and the APK release with your GitHub token, then returns the result through the Workflows API. On le-chonk-control, the judge reads the diff and merges the PR through the connector, and the reply goes to the Slack thread through the Slack connector. Three gaps of today's platform are marked: no trigger for new messages, a child workflow runs on its parent's deployment, and there is no hosted sandbox built from your own image.</desc>
  <defs>
    <marker id="next-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="next-arrow-connector" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d4fc2"/>
    </marker>
  </defs>

