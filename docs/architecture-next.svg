      <circle cx="265" cy="284" r="9" fill="#374151"/><text x="265" y="288">2</text>
      <circle cx="416" cy="214" r="9" fill="#6d4fc2"/><text x="416" y="218">3</text>
      <circle cx="616" cy="214" r="9" fill="#6d4fc2"/><text x="616" y="218">4</text>
      <circle cx="616" cy="412" r="9" fill="#374151"/><text x="616" y="416">5</text>
      <circle cx="906" cy="478" r="9" fill="#374151"/><text x="906" y="482">6</text>
      <circle cx="1086" cy="526" r="9" fill="#374151"/><text x="1086" y="530">7</text>
      <circle cx="1016" cy="214" r="9" fill="#6d4fc2"/><text x="1016" y="218">8</text>
      <circle cx="1110" cy="318" r="9" fill="#6d4fc2"/><text x="1110" y="322">9</text>
