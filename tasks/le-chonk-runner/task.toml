schema_version = "1.4"
# The project the agent built, without build output, lands in the trial folder as artifacts/project/:
# collected after the agent finishes and before the verifier builds anything.
artifacts = [
    { source = "/app", destination = "project", exclude = ["build", ".kotlin", ".gradle", ".git", "*.apk", "DerivedData"] },
]

[task]
name = "dambatenne/le-chonk-runner"
version = "1.0.0"
description = "Build Le Chonk Runner, a small Compose Multiplatform endless runner for Android and iOS, with the Kotlin Toolchain. Scored with the eight assertions of the kotlin-tooling-kotlin-toolchain skill's own eval."
keywords = ["kotlin", "kotlin-toolchain", "compose-multiplatform", "android", "ios", "agent-skills"]

[metadata]
category = "software_engineering"
difficulty = "medium"
tags = ["kotlin", "kmp", "compose", "skill-ab"]

[agent]
# A long agentic build; slower under amd64 emulation on an Apple Silicon Mac.
timeout_sec = 3600.0

[verifier]
# The verifier builds the APK and runs the shared tests itself.
timeout_sec = 2400.0

[environment]
# The first image build downloads the toolchain, the Android SDK and the Compose dependencies.
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 6144
workdir = "/app"
# Builds download from Maven Central, Google Maven and JetBrains' repositories.
network_mode = "public"
